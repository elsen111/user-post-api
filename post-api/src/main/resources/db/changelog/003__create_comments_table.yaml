databaseChangeLog:

  - changeSet:
      id: 003__create_comments_table
      author: elshan

      changes:

        - createTable:
            tableName: comments

            columns:

              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: post_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: content
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: post_id
            referencedTableName: posts
            referencedColumnNames: id
            constraintName: fk_comments_post
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_comments_user
            onDelete: CASCADE

        - createIndex:
            tableName: comments
            indexName: idx_comments_post_id
            columns:
              - column:
                  name: post_id

        - createIndex:
            tableName: comments
            indexName: idx_comments_user_id
            columns:
              - column:
                  name: user_id